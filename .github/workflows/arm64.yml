name: arm64

# Native ARM64 verification.
#
# Binary determinism is an intra-architecture guarantee, so the ARM job compares its tensors
# against digests recorded on ARM. Agreement with x86-64 is a numeric claim rather than a byte
# one — RustFFT selects AVX2 on one and NEON on the other, and they round differently — so it is
# measured in ULP against reference tensors dumped by the x86-64 job in this same run, which
# keeps both sides on fixtures built by the same FFmpeg.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  x86-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: sudo apt-get update && sudo apt-get install -y nasm ffmpeg
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace
      - run: python3 -m pip install --break-system-packages -r python/requirements-test.txt
      - run: python3 scripts/generate_matrix.py
      - run: bash scripts/gen_hevc_fixtures.sh
      - run: python3 scripts/gen_short_tail_fixtures.py
      - name: Dump the reference tensors the ARM job measures itself against
        run: python3 scripts/test_arch_tolerance.py --dump reference-tensors
      - uses: actions/upload-artifact@v4
        with:
          name: x86-reference-tensors
          path: reference-tensors/

  linux-arm64:
    # GitHub's ARM64 Linux runner. Self-hosted Graviton or Jetson runners work too.
    runs-on: ubuntu-24.04-arm
    needs: x86-reference
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      # No NASM: the vendored OpenH264 uses its ARM64 NEON assembly (.S files compiled
      # by the C compiler), selected by build.rs from the target architecture.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --manifest-path vendor/rusty_aac/Cargo.toml --lib
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Confirm the ARM64 build really carries NEON assembly
        run: |
          set -eu
          # [profile.release] sets strip = true, so the linked binary carries no symbol table
          # and nm on it can never match. Inspect the OpenH264 objects the build script
          # produced instead: the aarch64 .S kernels this job exercises compile into those.
          objs=$(find target/release/build -path '*openh264*' -name '*.o')
          [ -n "$objs" ] || { echo 'no OpenH264 build objects found'; exit 1; }
          count=$(nm $objs 2>/dev/null | grep -ciE 'aarch64|neon' || true)
          [ "$count" -gt 0 ] || { echo 'no NEON symbols in the OpenH264 objects'; exit 1; }
          echo "NEON symbols present: $count"
      - run: python3 -m pip install --break-system-packages -r python/requirements-test.txt
      - run: python3 scripts/generate_matrix.py
      - run: bash scripts/gen_hevc_fixtures.sh
      - run: python3 scripts/gen_short_tail_fixtures.py
      - name: Independent FFmpeg oracle (H.264 and H.265)
        run: |
          python3 scripts/test_hevc_fidelity.py
          python3 scripts/test_audio_tail_tolerance.py
      - uses: actions/download-artifact@v4
        with:
          name: x86-reference-tensors
          path: reference-tensors
      - name: Agreement with x86-64, measured in ULP
        run: python3 scripts/test_arch_tolerance.py --compare reference-tensors
      - name: Record this architecture's digests for review
        if: always()
        run: python3 scripts/test_arch_identity.py --record --out recorded/arch-digests-aarch64.json
      - name: Binary determinism on this architecture
        run: python3 scripts/test_arch_identity.py
      - run: python3 scripts/test_concurrency.py
      - name: Build the aarch64 wheel
        run: WHEEL_TARGET=aarch64-unknown-linux-gnu bash scripts/build_wheel.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-evidence
          path: |
            evidence/
            recorded/
            dist/

  cross-check-arm64-assembly:
    # Cheap x86-64 job: cross-compile the vendored OpenH264 for aarch64 and decode under
    # emulation, so an assembly or build.rs regression is caught even without ARM hardware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu qemu-user-static ffmpeg
      - run: bash scripts/check_arm64_openh264.sh
