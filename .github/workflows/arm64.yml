name: arm64

# Native ARM64 verification. The engine's determinism promise spans machines, so this
# runs the same gates as the x86-64 job and then checks the tensors byte for byte
# against the digests recorded on x86-64 (evidence/arch-digests.json).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-arm64:
    # GitHub's ARM64 Linux runner. Self-hosted Graviton or Jetson runners work too.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      # No NASM: the vendored OpenH264 uses its ARM64 NEON assembly (.S files compiled
      # by the C compiler), selected by build.rs from the target architecture.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --manifest-path vendor/rusty_aac/Cargo.toml --lib
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Confirm the ARM64 build really carries NEON assembly
        run: |
          set -eu
          # OpenH264's aarch64 kernels are the assembly this job exists to exercise.
          nm -C target/release/tenzor | grep -qi "AArch64\|_neon" \
            || { echo "no NEON symbols found in the binary"; exit 1; }
          echo "NEON symbols present: $(nm -C target/release/tenzor | grep -ci 'AArch64\|_neon')"
      - run: python3 -m pip install --break-system-packages -r python/requirements-test.txt
      - run: python3 scripts/generate_matrix.py
      - run: bash scripts/gen_hevc_fixtures.sh
      - run: python3 scripts/gen_short_tail_fixtures.py
      - name: Independent FFmpeg oracle (H.264 and H.265)
        run: |
          python3 scripts/test_hevc_fidelity.py
          python3 scripts/test_audio_tail_tolerance.py
      - name: Cross-architecture tensor identity vs the recorded x86-64 digests
        run: python3 scripts/test_arch_identity.py
      - run: python3 scripts/test_concurrency.py
      - name: Build the aarch64 wheel
        run: WHEEL_TARGET=aarch64-unknown-linux-gnu bash scripts/build_wheel.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-evidence
          path: |
            evidence/
            dist/

  cross-check-arm64-assembly:
    # Cheap x86-64 job: cross-compile the vendored OpenH264 for aarch64 and decode under
    # emulation, so an assembly or build.rs regression is caught even without ARM hardware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu qemu-user-static ffmpeg
      - run: bash scripts/check_arm64_openh264.sh
