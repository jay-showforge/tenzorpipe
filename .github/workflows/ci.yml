name: verify
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y nasm ffmpeg
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --release --locked --workspace
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --manifest-path vendor/rusty_aac/Cargo.toml --lib
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check licenses
      - run: python3 -m pip install --break-system-packages -r python/requirements-test.txt
      - run: python3 -m pip install --break-system-packages torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      # Bit-exactness of the vendored SIMD 8x8 transform against the C reference it
      # replaces; a no-op on non-x86 runners.
      - run: bash scripts/test_idct8x8_simd.sh
      - run: python3 scripts/generate_matrix.py
      - run: bash scripts/gen_hevc_fixtures.sh
      - run: python3 scripts/gen_short_tail_fixtures.py
      # The truncated-PTS fixtures are committed; check they still match their generator.
      - run: python3 scripts/gen_truncated_pts_fixture.py --verify
      - run: python3 scripts/test_matrix.py
      - run: python3 scripts/test_hevc_fidelity.py
      - run: python3 scripts/test_audio_tail_tolerance.py
      # Recorded for review, never fed back into the gate below: the engine version
      # string is embedded in every artifact, so a version bump changes all of them.
      - name: Record this architecture's digests for review
        if: always()
        run: python3 scripts/test_arch_identity.py --record --out recorded/arch-digests-x86_64.json
      - name: Binary determinism on this architecture
        run: python3 scripts/test_arch_identity.py
      - run: bash scripts/build_wheel.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            evidence/
            recorded/
            dist/
