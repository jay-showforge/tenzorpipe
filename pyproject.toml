[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "tenzorpipe"
dynamic = ["version"]
description = "MP4 H.264/AAC and WAV to synchronized video and Log-Mel tensors in Apache Arrow, decoded on the CPU"
readme = "README.md"
requires-python = ">=3.9"
license = "BUSL-1.1"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES/**/*"]
authors = [{ name = "Jonathan Tyler Montgomery" }]
keywords = ["video", "audio", "dataloader", "arrow", "pytorch", "h264", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "pyarrow>=14"]

[project.optional-dependencies]
torch = ["torch>=2.1"]

[project.scripts]
tenzor = "tenzorpipe.cli:main"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
module-name = "tenzorpipe._engine"
python-source = "python"
bindings = "pyo3"
locked = true
