[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Preserve the supplied project license; this exception cannot authorize dependencies.
[[licenses.exceptions]]
name = "tenzor-pipe"
version = "=0.3.1"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
name = "tenzorpipe-python"
version = "=0.3.1"
allow = ["BUSL-1.1"]
